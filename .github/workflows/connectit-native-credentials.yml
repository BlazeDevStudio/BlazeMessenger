name: ConnectIT native credential adapter (draft)
on:
  push:
    branches: ['migration/connectit-lan-source-20261029']
    paths:
      - '.github/workflows/connectit-native-credentials.yml'
      - 'ConnectIT/ConnectIT-LAN-Messenger-Draft/native_flutter/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-native-adapter-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies, analyze, run signer regressions
        working-directory: ConnectIT/ConnectIT-LAN-Messenger-Draft/native_flutter
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test
