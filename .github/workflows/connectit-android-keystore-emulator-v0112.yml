name: ConnectIT v0.1.12 native Android keystore and Master acceptance (DRAFT)
on:
  push:
    branches: [feature/connectit-android-keystore-emulator-v0112-20261030]
    paths:
      - '.github/workflows/connectit-android-keystore-emulator-v0112.yml'
      - 'ConnectIT/ConnectIT-LAN-Messenger-Draft/android_smoke/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-emulator-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Prepare disposable localhost Master and ephemeral account
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev
          export MASTER_DIR="$RUNNER_TEMP/connectit-native-test-master"
          export CONNECTIT_BOOTSTRAP_PASSWORD="$(openssl rand -base64 32)"
          export CONNECTIT_OLD_ADMIN_PASSWORD="$CONNECTIT_BOOTSTRAP_PASSWORD"
          export CONNECTIT_NEW_ADMIN_PASSWORD="$(openssl rand -base64 32)"
          export CONNECTIT_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$CONNECTIT_PASSWORD"
          (cd ConnectIT/ConnectIT-Master-Seed && CGO_ENABLED=1 go build -o "$RUNNER_TEMP/connectit-native-test-master-bin" .)
          "$RUNNER_TEMP/connectit-native-test-master-bin" init --dir "$MASTER_DIR" >/dev/null
          "$RUNNER_TEMP/connectit-native-test-master-bin" admin-rotate --dir "$MASTER_DIR" >/dev/null
          "$RUNNER_TEMP/connectit-native-test-master-bin" account-create --dir "$MASTER_DIR" --nickname "EmulatorOnly" >/dev/null
          ACCOUNT="$(python3 -c 'import os,sqlite3;print(sqlite3.connect(os.environ["MASTER_DIR"]+"/connectit.sqlite3").execute("select id from accounts").fetchone()[0])')"
          PIN="$(cat "$MASTER_DIR/public.key")"
          echo "CONNECTIT_TEST_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          echo "CONNECTIT_TEST_PASSWORD=$CONNECTIT_PASSWORD" >> "$GITHUB_ENV"
          echo "CONNECTIT_TEST_MASTER_PIN=$PIN" >> "$GITHUB_ENV"
          echo "CONNECTIT_TEST_MASTER_DIR=$MASTER_DIR" >> "$GITHUB_ENV"
          echo "CONNECTIT_TEST_MASTER_BIN=$RUNNER_TEMP/connectit-native-test-master-bin" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify brand source fingerprint (no redesign)
        shell: bash
        run: |
          set -euo pipefail
          cd ConnectIT/ConnectIT-LAN-Messenger-Draft/android_smoke/assets/brand
          printf '%s\n' \
            '55771df5907b913e3ae00221991237ab29d4a41679f492bbb43a9ecc607e9afd  main-plain.svg' \
            '75e4375e0694d366163eb46565f14d2bdbcab1d070e96bf6e7ca797e68c6c559  sublogo-network.svg' | sha256sum -c -
      - name: Prepare Android test app from independent Flutter source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ConnectIT/ConnectIT-LAN-Messenger-Draft
          SRC="$ROOT/android_smoke"
          OUT="$ROOT/android_smoke_build"
          flutter create --platforms=android --project-name connectit_android_smoke --org com.blazedevstudio "$OUT"
          cp "$SRC/pubspec.yaml" "$OUT/pubspec.yaml"
          cp "$SRC/lib/main.dart" "$OUT/lib/main.dart"
          rm -rf "$OUT/test"
          mkdir -p "$OUT/test" "$OUT/integration_test" "$OUT/assets/brand"
          cp "$SRC/test/"*.dart "$OUT/test/"
          cp "$SRC/integration_test/"*.dart "$OUT/integration_test/"
          cp "$SRC/assets/brand/"*.svg "$OUT/assets/brand/"
          python3 - <<'PY'
          from pathlib import Path
          app = Path('ConnectIT/ConnectIT-LAN-Messenger-Draft/android_smoke_build/android/app/src')
          manifest = app/'main/AndroidManifest.xml'
          raw = manifest.read_text()
          if 'android.permission.INTERNET' not in raw:
              raw = raw.replace('<application',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          manifest.write_text(raw)
          # Test-only localhost HTTP is needed for adb reverse. Do NOT permit
          # remote plaintext; the Dart Master client independently rejects it.
          debug = app/'debug/AndroidManifest.xml'
          old = debug.read_text()
          if 'usesCleartextTraffic' not in old:
              old = old.replace('<application',
                  '<application android:usesCleartextTraffic="true"',1)
          debug.write_text(old)
          PY
          (cd "$OUT" && flutter pub get && flutter analyze && flutter test test --reporter expanded)
      - name: Enable Linux KVM for emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else
            echo 'KVM device missing; emulator acceptance cannot be claimed'
            exit 1
          fi
      - name: Real Android plugin + local Master auth in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            "$CONNECTIT_TEST_MASTER_BIN" start --dir "$CONNECTIT_TEST_MASTER_DIR" --listen 127.0.0.1:18987 > "$RUNNER_TEMP/connectit-master-emulator.log" 2>&1 &
            MASTER_PID=$!
            trap 'kill "$MASTER_PID" 2>/dev/null || true' EXIT
            for i in $(seq 1 120); do
              if curl -fsS --max-time 2 http://127.0.0.1:18987/healthz > /dev/null 2>&1; then break; fi
              sleep 0.25
            done
            curl -fsS --max-time 3 http://127.0.0.1:18987/healthz > /dev/null
            adb reverse tcp:18987 tcp:18987
            cd ConnectIT/ConnectIT-LAN-Messenger-Draft/android_smoke_build
            flutter devices
            flutter test integration_test/connectit_keystore_android_test.dart -d emulator-5554 --reporter expanded
            flutter test integration_test/connectit_emulator_enroll_test.dart -d emulator-5554 --reporter expanded \
              --dart-define="CONNECTIT_TEST_ACCOUNT=$CONNECTIT_TEST_ACCOUNT" \
              --dart-define="CONNECTIT_TEST_PASSWORD=$CONNECTIT_TEST_PASSWORD" \
              --dart-define="CONNECTIT_TEST_MASTER_PIN=$CONNECTIT_TEST_MASTER_PIN"
            adb shell am force-stop com.blazedevstudio.connectit_android_smoke || true
            flutter test integration_test/connectit_emulator_returning_test.dart -d emulator-5554 --reporter expanded \
              --dart-define="CONNECTIT_TEST_ACCOUNT=$CONNECTIT_TEST_ACCOUNT" \
              --dart-define="CONNECTIT_TEST_PASSWORD=$CONNECTIT_TEST_PASSWORD" \
              --dart-define="CONNECTIT_TEST_MASTER_PIN=$CONNECTIT_TEST_MASTER_PIN"
            python3 - <<'PY'
            import os,sqlite3
            cx=sqlite3.connect(os.environ['CONNECTIT_TEST_MASTER_DIR']+'/connectit.sqlite3')
            count=cx.execute('select count(*) from devices').fetchone()[0]
            assert count==1,f'Returning auth must not register a second device; got {count}'
            print('Android emulator: one original trusted device; no re-enrollment')
            PY
      - name: Build isolated Android debug artifact after emulator acceptance
        working-directory: ConnectIT/ConnectIT-LAN-Messenger-Draft/android_smoke_build
        shell: bash
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connectit-v0112-android-emulator-verified-debug-apk
          path: ConnectIT/ConnectIT-LAN-Messenger-Draft/android_smoke_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
