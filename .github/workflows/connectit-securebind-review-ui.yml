name: ConnectIT SecureBind review UI (draft)
on:
  push:
    branches:
      - feature/connectit-securebind-review-ui-20261030
    paths:
      - '.github/workflows/connectit-securebind-review-ui.yml'
      - 'ConnectIT/ConnectIT-LAN-Messenger-Draft/native_flutter/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-review-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test SecureBind staging
        working-directory: ConnectIT/ConnectIT-LAN-Messenger-Draft/native_flutter
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
